openapi: 3.0.3
info:
  title: 뭔말인교? API
  description: |
    판교어 해석 + 간격 반복 학습 서비스 "뭔말인교?"의 RESTful API 명세서입니다.

    ## 서비스 구조
    계정 → 프로젝트(코드명 + 설명) → { 회의(= 회의록: 녹음, 해석, 할 일, 모르는 말), 메시지 해석(회의와 무관), 할 일 }
    모르는 말(카드)은 서비스 전체 단어장이며 프로젝트로 걸러 봅니다. 웹, 앱은 같은 계정, 같은 DB를 씁니다.

    ## 서비스 흐름
    판교어를 만난다 → (해석) 이해한다 → (카드) 담는다 → (복습) 떠올린다 → (판교어 실력 테스트) 확인한다

    ## 공통 규칙
    - 날짜/시간 형식: ISO 8601 (예: 2026-09-17T13:30:00)
    - 날짜 형식: YYYY-MM-DD (예: 2026-09-17)
    - 페이지네이션: 목록 API는 page(1부터), size 쿼리 파라미터를 지원하며 응답은 PagedResponse 래퍼 구조로 반환합니다.
    - 모든 에러 응답은 공통 Error 스키마를 사용합니다.
    - 화면 ID는 UI 흐름도(v5.2)와 대응합니다. 앱: O-1~3, S-01, S-00-1~5, A-01~A-13 / 웹: W-00~W-08, W-02a. 화면이 없는 기능(관리 화면 등)은 범위에서 제외했습니다.
    - 본 명세는 평가 기준에 따라 Security Schemes 정의를 제외합니다. (401/403 응답은 정의)
  version: 1.0.0
  contact:
    name: SKALA AI 웹 서비스 설계 Mini-project

servers:
  - url: http://localhost:8080/api
    description: 로컬 개발 서버
  - url: https://api.mwonmalingyo.kr/api
    description: 운영 서버

tags:
  - name: Auth
    description: 소셜 로그인, 첫 로그인 시 자동 가입 (S-01 로그인)
  - name: User
    description: 내 정보, 학습 통계, 온보딩 (A-01 홈, A-09 MY, S-00-2, S-00-5 온보딩)
  - name: Translation
    description: AI 해석, 할 일 (W-01, W-03, A-06, 할 일 모아보기 A-01, W-00, W-08)
  - name: Term
    description: 판교어 사전 조회 (해석 결과의 용어 뜻 미리보기)
  - name: Card
    description: 모르는 말(학습 카드), 서비스 전체 단어장 + 프로젝트 필터 (W-05, W-00, W-03, A-06)
  - name: Review
    description: 간격 반복 복습 (A-03, A-04)
  - name: Exam
    description: 판교어 실력 테스트 (A-07, A-08)
  - name: Level
    description: 판교 등급 마스터 5단계 (A-09, S-00-5)
  - name: Recording
    description: 회의 녹음, 동의 필수, 30일 뒤 음성 삭제 (W-02a, W-02, W-04)
  - name: Notification
    description: iOS 푸시 토큰, 알림 설정 (S-00-3, A-02, A-05 iOS 시스템 알림), 웹, 앱은 같은 계정, 같은 DB라 별도 동기화 API 없음
  - name: Project
    description: 프로젝트, 웹 W-08, W-00 / 앱 A-13, A-10, A-11 / 온보딩 S-00-4
  - name: Meeting
    description: 회의(= 회의록), 프로젝트 안에서 만들고, 그 안에서 녹음, 해석 (W-06, W-07, A-12)

paths:
  # ==========================================
  # [Auth] 소셜 로그인 - S-01
  # ==========================================
  /auth/oauth/{provider}:
    parameters:
      - name: provider
        in: path
        required: true
        description: OAuth 제공자 (S-01 Apple, 카카오, Google)
        schema:
          type: string
          enum: [apple, kakao, google]
        example: google
    post:
      tags: [Auth]
      summary: 소셜 로그인 (OAuth 2.0 코드 교환)
      description: |
        화면 S-01. 제공자 인증 화면에서 받은 authorization code를 보내면
        서버가 제공자에게 토큰을 교환하고 회원을 조회/생성합니다.

        - 기존 회원이면 로그인, 신규면 가입 후 `isNewUser: true`
        - `isNewUser`가 true이거나 `onboardedAt`이 null이면 화면은 **S-00-1 온보딩(직군)**으로 보냅니다.
        - 같은 이메일이 이미 다른 소셜 제공자로 가입돼 있으면 409 EMAIL_ALREADY_REGISTERED
      operationId: oauthLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthLoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /onboarding:
    post:
      tags: [User]
      summary: 온보딩 완료 (직군 + 레벨 진단)
      description: |
        화면 S-00-5(준비 완료)에서 호출. 온보딩에서 모은 값을 한 번에 저장합니다.

        1. S-00-1 직군 선택 → `jobGroup`
        2. S-00-2 **레벨 진단**, 판교어 10개 중 아는 것 체크 → `knownTermIds`
        3. 복습 알림 시간 → `reminderHour` (선택. S-00-3에서는 `PATCH /users/me/notification-settings`로 따로 저장)

        S-00-4 첫 프로젝트는 `POST /projects`로 따로 만듭니다.

        서버는 **모르는 용어(체크 안 한 것)를 학습 카드로 자동 생성**합니다.
        즉 가입 직후부터 복습할 카드가 존재합니다. (빈 화면 방지)
        완료 시 `users.onboarded_at`이 기록되어 다음 로그인부터는 홈으로 바로 갑니다.
      operationId: completeOnboarding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
      responses:
        '200':
          description: 온보딩 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingResponse'
              example:
                user:
                  userId: 8
                  nickname: 판교뉴비
                  jobGroup: 기획
                  role: MEMBER
                  currentStreak: 0
                createdCardCount: 7
                knownCount: 3
                estimatedLevel:
                  code: TOURIST
                  name: 관광객
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /onboarding/diagnosis-terms:
    get:
      tags: [User]
      summary: 레벨 진단용 용어 목록
      description: 화면 S-00-2 레벨 진단. 승인된 용어 중 대표 10개를 반환합니다.
      operationId: getDiagnosisTerms
      parameters:
        - name: size
          in: query
          required: false
          description: 진단 용어 수
          schema:
            type: integer
            default: 10
            minimum: 5
            maximum: 20
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TermSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==========================================
  # [User] 내 정보 및 학습 통계 - A-01, A-09
  # ==========================================
  /users/me:
    get:
      tags: [User]
      summary: 내 정보 조회
      description: 화면 A-09 MY(닉네임, 등급, 스트릭, 설정).
      operationId: getMe
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [User]
      summary: 내 정보 수정
      description: 화면 A-10(currentProjectId 저장) 등 내 정보 수정. 닉네임 중복 시 409.
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /users/me/stats:
    get:
      tags: [User]
      summary: 내 학습 통계 조회
      description: |
        화면 A-01 홈, A-09 MY.
        오늘 복습해야 할 카드 수(dueCount), 스트릭, 기억률 곡선을 반환합니다.
      operationId: getMyStats
      parameters:
        - name: days
          in: query
          required: false
          description: 기억률 곡선 조회 기간(일)
          schema:
            type: integer
            default: 30
            minimum: 7
            maximum: 180
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStatsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/quizzes:
    get:
      tags: [Exam]
      summary: 내 판교어 실력 테스트 응시 이력
      description: 지난 판교어 실력 테스트 점수, 등급 이력 (현재 전용 화면 없음).
      operationId: getMyQuizzes
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      content:
                        type: array
                        items:
                          $ref: '#/components/schemas/QuizSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==========================================
  # [Translation] AI 해석 - W-01, W-03, A-06
  # ==========================================
  /translations:
    post:
      tags: [Translation]
      summary: 판교어 해석 실행 (핵심 API)
      description: |
        화면 W-01(앱은 A-11, A-12 붙여넣기 시트). 판교어 메시지를 붙여넣으면 한 번의 호출로 네 가지를 반환합니다.
        `meetingId`를 주면 그 회의록에, 없으면 프로젝트의 「메시지 해석」(회의와 무관한 슬랙, 메일, 캡처)으로 저장합니다.

        1. **쉬운 말 해석** (resultText)
        2. **할 일 추출** (actionItems), 내가 해야 할 일 + 기한 힌트
        3. **뉘앙스 해석** (intentType, nuance), 완곡 표현의 실제 의도와 대응 팁
        4. **모르는 용어** (detectedTerms), 카드 담기 대상

        - jargonCount가 0이면 화면은 "이 문장은 이미 청정 한국어입니다 🌿" 빈 상태를 보여줍니다.
        - detectedTerms의 startIndex/endIndex로 원문에 형광펜 하이라이트를 그립니다.
        - 사전에 없는 신규 판교어는 termId가 null이며 AI 해석만 제공합니다.
        - actionItems가 비어 있으면 화면의 🎯 블록을 숨깁니다 (단순 공유 메시지).
        - 비로그인 사용자는 1일 3회까지만 허용되며 초과 시 429, AI 엔진 장애 시 503입니다.
      operationId: createTranslation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranslationRequest'
      responses:
        '201':
          description: 해석 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationResponse'
              examples:
                업무지시해독:
                  summary: 할 일 2개와 뉘앙스를 함께 해석한 경우 (대표 시나리오)
                  value:
                    translationId: 1024
                    projectId: 7
                    projectName: 루나
                    meetingId: 12
                    meetingTitle: 스프린트 계획 회의
                    sourceType: MESSAGE
                    inputSource: TYPED
                    direction: JARGON_TO_PLAIN
                    sourceText: 이번 스프린트 스코프 아웃하고 넥스트로 밀죠. 그 전에 R&R 정리해서 얼라인 쳐주세요
                    resultText: 이번 작업 범위에서 빼고 다음으로 미루죠. 그 전에 누가 뭘 할지 정리해서 합의해 주세요.
                    jargonCount: 4
                    intentType: DECISION
                    nuance:
                      note: '"밀죠"는 제안형이지만 실제로는 이미 결정된 내용을 통보하는 표현입니다.'
                      tip: 되묻기보다 일정만 확인하는 편이 안전합니다.
                      confidence: 0.88
                    actionItems:
                      - actionId: 5001
                        sortOrder: 1
                        actionText: 담당자별 역할 정리 문서 만들기
                        dueHint: 다음 스프린트 시작 전
                        dueAt: '2026-09-16T17:30:00'
                        isChecked: false
                        alertEnabled: true
                        checkedAt: null
                      - actionId: 5002
                        sortOrder: 2
                        actionText: 관련 팀과 합의 (회의 또는 슬랙)
                        dueHint: 다음 스프린트 시작 전
                        dueAt: '2026-09-17T11:00:00'
                        isChecked: false
                        alertEnabled: true
                        checkedAt: null
                    aiModel: claude-opus-5
                    latencyMs: 1240
                    detectedTerms:
                      - termId: 21
                        termKo: 스코프 아웃
                        plainKo: 작업 범위에서 제외
                        matchedText: 스코프 아웃
                        startIndex: 8
                        endIndex: 14
                        confidence: 0.981
                        inMyCards: false
                      - termId: 25
                        termKo: 넥스트
                        plainKo: 다음 차례, 다음 일정
                        matchedText: 넥스트
                        startIndex: 17
                        endIndex: 20
                        confidence: 0.977
                        inMyCards: false
                      - termId: 18
                        termKo: R&R
                        plainKo: 역할과 책임
                        matchedText: R&R
                        startIndex: 31
                        endIndex: 34
                        confidence: 0.965
                        inMyCards: false
                      - termId: 3
                        termKo: 얼라인
                        plainKo: 방향 맞추기
                        matchedText: 얼라인
                        startIndex: 40
                        endIndex: 43
                        confidence: 0.972
                        inMyCards: true
                    createdAt: '2026-09-16T10:22:31'
                완곡한거절:
                  summary: 할 일은 없고 뉘앙스만 중요한 경우
                  value:
                    translationId: 1026
                    direction: JARGON_TO_PLAIN
                    sourceText: 그건 좀 챌린지가 있을 것 같은데요. 일단 팔로업할게요
                    resultText: 그건 좀 어려울 것 같습니다. 일단 나중에 챙겨 보겠습니다.
                    jargonCount: 2
                    intentType: DECLINE
                    nuance:
                      note: 완곡한 거절입니다. "일단 팔로업할게요"는 지금은 하지 않겠다는 뜻으로 쓰이는 경우가 많습니다.
                      tip: 기한을 정해 다시 확인하거나, 대안을 제시하는 편이 좋습니다.
                      confidence: 0.87
                    actionItems: []
                    aiModel: claude-opus-5
                    latencyMs: 910
                    detectedTerms:
                      - termId: 33
                        termKo: 챌린지
                        plainKo: 어려움
                        matchedText: 챌린지
                        startIndex: 5
                        endIndex: 8
                        confidence: 0.94
                        inMyCards: false
                      - termId: 7
                        termKo: 팔로업
                        plainKo: 이어서 챙기기
                        matchedText: 팔로업
                        startIndex: 24
                        endIndex: 27
                        confidence: 0.958
                        inMyCards: false
                    createdAt: '2026-09-16T11:02:10'
                청정한국어:
                  summary: 판교어가 없는 경우
                  value:
                    translationId: 1025
                    direction: JARGON_TO_PLAIN
                    sourceText: 오늘 점심 뭐 드실래요
                    resultText: 오늘 점심 뭐 드실래요
                    jargonCount: 0
                    intentType: QUESTION
                    nuance: null
                    actionItems: []
                    aiModel: claude-opus-5
                    latencyMs: 410
                    detectedTerms: []
                    createdAt: '2026-09-16T10:25:02'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      tags: [Translation]
      summary: 내 해석 기록 목록
      description: 화면 W-00 「메시지 해석」 목록(projectId + meetingId=none).
      operationId: getTranslations
      parameters:
        - name: meetingId
          in: query
          required: false
          description: 회의별 해석 목록. 'none'이면 회의 밖 해석만 (W-00 "회의 밖에서 해석한 말")
          schema:
            type: string
            example: none
        - name: projectId
          in: query
          required: false
          description: 프로젝트별 해석 목록 (W-00, W-01)
          schema:
            type: integer
            format: int64
        - name: direction
          in: query
          required: false
          description: 해석 방향 필터
          schema:
            $ref: '#/components/schemas/TranslationDirection'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      content:
                        type: array
                        items:
                          $ref: '#/components/schemas/TranslationSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /translations/{translationId}:
    parameters:
      - $ref: '#/components/parameters/TranslationIdParam'
    get:
      tags: [Translation]
      summary: 해석 기록 단건 조회
      operationId: getTranslation
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
