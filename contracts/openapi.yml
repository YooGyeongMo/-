  # ==========================================
  # [Recording] 회의 녹음 - W-02a, W-02, W-04
  # ==========================================
  /meetings/{meetingId}/recordings:
    parameters:
      - $ref: '#/components/parameters/MeetingIdParam'
    post:
      tags: [Recording]
      summary: 회의 녹음 업로드 (텍스트 변환 → 해석)
      description: |
        웹 W-02a(동의), W-02(녹음 중), 앱 A-12(같은 동의 시트). 회의 안에서 녹음한 음성을 **1분 단위 조각**으로 올립니다.
        - 첫 조각: `recordingId` 없이 보냄 → 녹음 생성(status RECORDING), 202로 recordingId 반환
        - 다음 조각: `recordingId`를 함께 보냄 → 받아쓰기(transcript)가 부분 갱신되어 W-02 "실시간 받아쓰기", W-04 미리보기에 보임
        - 마지막 조각: `final=true` → 전체 받아쓰기 확정 후 해석(판교어 찾기, 할 일 정리) 시작
        - 음성 파일은 30일 뒤 자동 삭제(expiresAt)
        - `consentConfirmed`가 true가 아니면 400 RECORDING_CONSENT_REQUIRED (참석자 녹음 고지 필수)
        - 처리는 비동기, 202로 recordingId를 돌려주고, 완료되면 DECODE_DONE 푸시를 보냅니다. 결과는 같은 계정이면 웹, 앱 어디서나 조회됩니다.
        - 최대 60분 / 200MB
      operationId: uploadRecording
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio, consentConfirmed, durationSec]
              properties:
                audio:
                  type: string
                  format: binary
                  description: 1분 단위 음성 조각
                recordingId:
                  type: integer
                  format: int64
                  nullable: true
                  description: 이어 올릴 녹음 ID (첫 조각이면 비움)
                  example: 301
                final:
                  type: boolean
                  default: false
                  description: 마지막 조각이면 true → 해석 시작
                durationSec:
                  type: integer
                  minimum: 1
                  maximum: 3600
                  example: 1860
                consentConfirmed:
                  type: boolean
                  description: 참석자에게 녹음 사실을 알렸는지
                  example: true
      responses:
        '202':
          description: 접수됨 (변환 진행 중)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'

  /recordings/{recordingId}:
    parameters:
      - name: recordingId
        in: path
        required: true
        description: 녹음 ID
        schema:
          type: integer
          format: int64
        example: 301
    get:
      tags: [Recording]
      summary: 녹음 변환 상태 조회
