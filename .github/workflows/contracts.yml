name: contracts
on:
  pull_request:
    paths: ["contracts/**", ".github/workflows/contracts.yml"]
  push:
    branches: [main]
    paths: ["contracts/**", ".github/workflows/contracts.yml"]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes @apidevtools/swagger-cli validate contracts/openapi.yml
      - run: npx --yes @redocly/cli lint contracts/openapi.yml --skip-rule security-defined
      - run: npx --yes -p @dbml/cli dbml2sql contracts/db.dbml --mysql -o /tmp/schema.sql && wc -l /tmp/schema.sql
      - run: "! grep -nE '·|—|판능시' contracts/openapi.yml contracts/db.dbml"
