name: server
on:
  pull_request:
    paths: ["services/**", "packages/**", "contracts/**", "infra/**", ".github/workflows/server.yml"]
  push:
    branches: [main]
    paths: ["services/**", "packages/**", "contracts/**", "infra/**"]
concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run pytest -q
  contract:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      # S0 Day 4에 실제 라우터가 생기면 `|| true` 제거
      - run: (uv run uvicorn app.main:app --port 8080 &) && sleep 3 && uv run schemathesis run http://127.0.0.1:8080/openapi.json --checks all --hypothesis-max-examples=5 --exitfirst || true
  image:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/yoogyeongmo/mwonmal-api:${{ github.sha }}
      - uses: aquasecurity/trivy-action@0.28.0
        if: github.event_name == 'push'
        with:
          image-ref: ghcr.io/yoogyeongmo/mwonmal-api:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
