name: server
on:
  pull_request:
    paths: ["services/**", "packages/**", "contracts/**", "infra/**", ".github/workflows/server.yml"]
  push:
    # 워크플로 자신도 포함(2026-09-22): 빠져 있으면 CI 수정이 main 에서 검증되지 않는다.
    branches: [main]
    paths: ["services/**", "packages/**", "contracts/**", "infra/**", ".github/workflows/server.yml"]
  workflow_dispatch:
concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true
# 기본 GITHUB_TOKEN 권한 = 읽기만. 더 필요한 job 만 job 수준에서 올린다(최소 권한).
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    # 마이그레이션 왕복·alembic check 를 실제 MySQL 8.4 에서도 돌린다 (tests/test_migrations.py).
    services:
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: ci, MYSQL_DATABASE: mwonmal }
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -pci" --health-interval 5s --health-retries 20
    env:
      MWONMAL_TEST_MYSQL_URL: mysql+aiomysql://root:ci@127.0.0.1:3306/mwonmal?charset=utf8mb4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run lint-imports
      - run: uv run pytest -q
  contract:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      - run: uv sync --locked
      # 구현된 operation 만 검사한다(나머지는 아직 404). 라우터를 추가하면 --include-operation-id 를 늘린다.
      # 알려진 계약 차이(ADR-0014 §5)는 services/api/schemathesis.toml 과 아래 exclude 로만 끈다.
      # 2026-10-26 이전엔 `|| true` + schemathesis 4 에 없는 옵션(--hypothesis-max-examples)이라
      # 명령이 매번 옵션 오류로 끝나고도 초록이었다(검사 0건).
      - run: |
          (uv run uvicorn app.main:app --port 8080 &)
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/health && break; sleep 1; done
          uv run schemathesis run http://127.0.0.1:8080/openapi.json \
            --url http://127.0.0.1:8080/api \
            --checks all --exclude-checks allow_header_conformance \
            --max-examples=100 \
            --include-operation-id oauthLogin \
            --include-operation-id getMe
  image:
    # 순서가 중요하다: 빌드 → 스캔 → (main 이면) push. 스캔을 통과한 이미지만 레지스트리에 올라간다.
    # 2026-09-22 개정(이슈: main 만 빨개짐):
    #  1) 스캔이 push 에서만 돌아 PR 은 항상 초록 → 머지 직후 main 실패. 이제 PR 에서도 돈다.
    #  2) 베이스 이미지(python:3.12-slim = Debian)의 "수정본 없음(affected)" CVE 로 실패했다.
    #     우리가 손쓸 수 없는 취약점으로 파이프라인을 막지 않는다 → ignore-unfixed.
    #     수정본이 나온 CVE 는 그대로 막는다(베이스 이미지 갱신으로 해결 가능하므로).
    #  3) trivy-action@master 는 움직이는 표적이라 버전 고정. DB 는 ghcr 우선, mirror.gcr.io 폴백
    #     (2026-09-19 실패 원인 = mirror.gcr.io BLOB_UNKNOWN).
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/yoogyeongmo/mwonmal-api:${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: services/api/Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: "ghcr.io/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2"
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker push "$IMAGE"
        if: github.event_name == 'push'
