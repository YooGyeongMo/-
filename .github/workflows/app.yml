# 앱 CI (ADR-0011: CI 러너 전략 개정, ADR-0002 supersede — FD-9)
#  - PR·push main = hosted macos-26, Xcode 26.4 고정(로컬과 동일; 올릴 때 스냅샷 재기록 PR과 함께). Tier1 만.
#  - nightly     = self-hosted(개발 Mac, 별도 macOS 계정, ephemeral 러너). schedule·workflow_dispatch·push main 만 —
#                  공개 저장소 fork PR 코드는 self-hosted 에서 절대 실행하지 않는다(RT-B-20). Tier2: iOS 17.0 최소 OS 시뮬.
#  - 동시 job 5 한도 → PR macOS job ≤ 4.
name: app
on:
  pull_request:
    paths: ["apps/**", "contracts/**", "packages/test-vectors/**", "scripts/check-module-deps.py", "scripts/check-xcstrings.py", ".github/workflows/app.yml", ".swiftlint.yml", ".swiftformat"]
  push:
    # 워크플로·린트 설정 자신도 포함한다. 빠져 있으면 CI 를 고쳐도 main 에서 한 번도 돌지 않아
    # main 배지가 옛 실패에 멈춘다(2026-09-22 발견).
    branches: [main]
    paths: ["apps/**", "contracts/**", "scripts/check-module-deps.py", "scripts/check-xcstrings.py", ".github/workflows/app.yml", ".swiftlint.yml", ".swiftformat"]
  schedule:
    - cron: "0 18 * * *"   # 03:00 KST (UTC+9) — ADR-0011 야간 Tier2
  workflow_dispatch:
concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true
env:
  XCODE_VERSION: "26.4"
# 기본 GITHUB_TOKEN 권한 = 읽기만. 더 필요한 job 만 job 수준에서 올린다(최소 권한).
permissions:
  contents: read
jobs:
  lint:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      # SwiftLint·SwiftFormat 버전은 .mise.toml 이 고정한다(로컬과 같게). brew 최신을 쓰면 새 규칙이 CI에서만 걸린다.
      - run: swiftlint version
      - run: swiftlint --strict
      - run: swiftformat --lint .
  build-test:
    # Tier1 (FD-1 검증 매트릭스): macOS 26 호스트 빌드+테스트 + iPhone 17 / iOS 26 시뮬레이터 테스트.
    # deployment target 이 iOS 17 / macOS 14 이므로 @available 누락은 컴파일 단계에서 잡힌다(REQ-02).
    # iOS 17.0 최소 OS 런타임 실행은 nightly(self-hosted)에서 — ADR-0011.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: macos-26
    needs: lint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '26.4'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            apps/ios-macos/.tuist-cache
            apps/ios-macos/Tuist/.build
          key: tuist-${{ runner.os }}-${{ env.XCODE_VERSION }}-${{ hashFiles('apps/ios-macos/Tuist/Package.resolved', 'apps/ios-macos/.package.resolved', 'apps/ios-macos/Packages/MwonmalAPI/Package.resolved', 'contracts/openapi.yml') }}
      # MwonmalAPI(생성 클라이언트 + 미들웨어)는 로컬 패키지라 Xcode 스킴 테스트에 들어가지 않는다. 따로 돌린다.
      - run: swift test --package-path apps/ios-macos/Packages/MwonmalAPI
      # ADR-0019: 온디바이스 지능 패키지(v1.0 앱에는 링크 안 함). FM 실호출 1건은 러너에 Apple Intelligence가 없어 이유를 찍고 건너뛴다.
      - run: swift test --package-path apps/ios-macos/Packages/MwonmalIntelligence
      - run: cd apps/ios-macos && tuist install && tuist generate --no-open
      # ADR-0016: Tuist는 순환만 막는다. 레이어 방향은 그래프를 내보내 읽을 수 있는 메시지로 검사한다.
      - run: python3 -I scripts/check-module-deps.py --self-test
      - run: mkdir -p "$RUNNER_TEMP/graph" && cd apps/ios-macos && tuist graph --format json --output-path "$RUNNER_TEMP/graph" --no-open && python3 -I ../../scripts/check-module-deps.py "$RUNNER_TEMP/graph/graph.json"
      # #99: 문구는 String Catalog(ko+en). 미번역·키 형식 위반이면 실패.
      - run: python3 -I scripts/check-xcstrings.py apps/ios-macos
      - run: cd apps/ios-macos && xcodebuild -workspace Mwonmal.xcworkspace -scheme MwonmalMac -destination 'platform=macOS' -skipPackagePluginValidation build
      - run: cd apps/ios-macos && xcodebuild -workspace Mwonmal.xcworkspace -scheme MwonmalMac -destination 'platform=macOS' -skipPackagePluginValidation test
      - run: cd apps/ios-macos && xcodebuild -workspace Mwonmal.xcworkspace -scheme MwonmalIOS -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' -skipPackagePluginValidation test
      # ADR-0025: 출시 빌드(-O)는 Debug와 컴파일 경로가 다르다(Swift 6.3 최적화에서 컴파일러가 죽은 적 있음). 서명 없이 빌드만.
      - run: cd apps/ios-macos && xcodebuild -workspace Mwonmal.xcworkspace -scheme MwonmalIOS -configuration Release -destination 'generic/platform=iOS' -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO build
  nightly:
    # Tier2 (ADR-0011 / FD-9): 최소 OS iOS 17.0 시뮬레이터(iPhone SE 3세대) 단위 테스트. hosted 이미지엔 17.0 런타임이 없어
    # self-hosted 러너(iOS 17.0 런타임·Xcode 26.4 사전 설치)에서만 돈다. fork PR 코드 실행 금지 → pull_request 제외.
    #
    # 2026-09-22 개정(이슈: 이 job 이 영원히 queued 로 남아 run 전체를 오염시킴):
    #  - `!= 'pull_request'` 는 push(main) 에서도 참이라 머지마다 60분짜리 Tier2 가 붙었다 → schedule·수동만.
    #  - 아직 등록된 self-hosted 러너가 0대라 job 이 러너를 못 찾고 큐에 머문다. 저장소 변수
    #    `SELF_HOSTED_MAC=true` 가 있을 때만 켠다. 러너를 붙인 뒤 켜는 법:
    #      gh variable set SELF_HOSTED_MAC --body true --repo YooGyeongMo/-
    #    (러너는 개발 Mac 의 별도 macOS 계정 + ephemeral. ADR-0011 / RT-B-20)
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && vars.SELF_HOSTED_MAC == 'true'
    runs-on: [self-hosted, macOS]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - run: xcodebuild -version | grep -q "Xcode ${XCODE_VERSION}"   # 러너에 26.4 사전 설치·선택되어 있어야 함(sudo 없이 검증만)
      - run: xcrun simctl list runtimes | grep -q "iOS 17.0" || xcodebuild -downloadPlatform iOS -buildVersion 17.0
      - run: xcrun simctl list devices available | grep -q "iPhone SE (3rd generation)" || xcrun simctl create "iPhone SE (3rd generation)" "iPhone SE (3rd generation)" "com.apple.CoreSimulator.SimRuntime.iOS-17-0"
      - run: cd apps/ios-macos && tuist install && tuist generate --no-open
      - run: cd apps/ios-macos && xcodebuild -workspace Mwonmal.xcworkspace -scheme MwonmalIOS -destination 'platform=iOS Simulator,name=iPhone SE (3rd generation),OS=17.0' -skipPackagePluginValidation test
      - run: cd apps/ios-macos && xcodebuild -workspace Mwonmal.xcworkspace -scheme MwonmalMac -destination 'platform=macOS' -skipPackagePluginValidation test
