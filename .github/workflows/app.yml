name: app
on:
  pull_request:
    paths: ["apps/**", "contracts/**", "packages/test-vectors/**", ".github/workflows/app.yml", ".swiftlint.yml", ".swiftformat"]
  push:
    branches: [main]
    paths: ["apps/**", "contracts/**"]
concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: brew install swiftlint
      - run: swiftlint --strict
      - run: swiftformat --lint .
  build-test:
    # hosted macos-15는 호스트 OS가 15라 macOS 26 타깃 테스트를 못 돌린다 → 단위 테스트는 iOS 26 시뮬레이터로. macOS 실행 테스트는 self-hosted(macOS 26) 러너에서 (ADR-0002).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/cache@v4
        with:
          path: |
            apps/ios-macos/.tuist-cache
            apps/ios-macos/Tuist/.build
          key: tuist-${{ runner.os }}-${{ hashFiles('apps/ios-macos/Tuist/Package.resolved', 'contracts/openapi.yml') }}
      - run: cd apps/ios-macos && tuist install && tuist generate --no-open
      - run: cd apps/ios-macos && xcodebuild -workspace Mwonmal.xcworkspace -scheme MwonmalMac -destination 'platform=macOS' -skipPackagePluginValidation build
      - run: cd apps/ios-macos && tuist test MwonmalIOS --no-selective-testing
