name: secrets
# 공개 저장소 시크릿 게이트(ADR-0004). 경로 필터 없음: 어떤 파일이 바뀌든 모든 PR·main push 에서 돈다.
# 2026-10-25 이전엔 contracts.yml 안에 있어서 contracts/** 변경 때만 돌았다(코드 PR 미검사).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
