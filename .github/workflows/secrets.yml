name: secrets
# 공개 저장소 시크릿 게이트(ADR-0004). 경로 필터 없음: 어떤 파일이 바뀌든 모든 PR·main push 에서 돈다.
# 2026-10-25 이전엔 contracts.yml 안에 있어서 contracts/** 변경 때만 돌았다(코드 PR 미검사).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true
# 기본 GITHUB_TOKEN 권한 = 읽기만. 더 필요한 job 만 job 수준에서 올린다(최소 권한).
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
