name: mwonmal
services:
  caddy:
    image: caddy:2
    ports: ["8080:80"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data"]
    # 블루그린 활성 색(deploy/blue-green.sh 가 씀, git 무시). 없으면 Caddyfile 기본값 blue.
    env_file: [{ path: .upstream, required: false }]
    depends_on: [api_blue]
  api_blue:
    build: { context: .., dockerfile: services/api/Dockerfile }
    image: ghcr.io/yoogyeongmo/mwonmal-api:${API_TAG:-local}
    environment:
      MWONMAL_ENV: ${MWONMAL_ENV:-local}
      MWONMAL_DATABASE_URL: mysql+aiomysql://root:local@mysql:3306/mwonmal?charset=utf8mb4
      # AI 한도 카운터·브레이커 공유(#36). local 밖(prod)에선 없으면 기동 거부.
      MWONMAL_REDIS_URL: redis://redis:6379/0
      # 기본은 로컬 개발. 서버(블루그린)에선 infra/.env 로 MWONMAL_ENV=prod 등을 준다 — 그러면
      # 이미지의 fail-closed 검사(JWT 키 필수)가 그대로 동작한다. local 은 JWT 임시 키라 워커마다
      # 키가 다르다 → 워커 1개(아니면 토큰이 절반 확률로 401).
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    depends_on: { mysql: { condition: service_healthy }, redis: { condition: service_started } }
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/ready')"], interval: 5s, retries: 10 }
  api_green:
    build: { context: .., dockerfile: services/api/Dockerfile }
    image: ghcr.io/yoogyeongmo/mwonmal-api:${API_TAG:-local}
    environment:
      MWONMAL_ENV: ${MWONMAL_ENV:-local}
      MWONMAL_DATABASE_URL: mysql+aiomysql://root:local@mysql:3306/mwonmal?charset=utf8mb4
      MWONMAL_REDIS_URL: redis://redis:6379/0
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    profiles: [green]
  mysql:
    image: mysql:8.4
    environment: { MYSQL_ROOT_PASSWORD: local, MYSQL_DATABASE: mwonmal }
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-plocal"], interval: 5s, retries: 20 }
  redis:
    image: redis:7-alpine
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: local, MINIO_ROOT_PASSWORD: localpass }
    # 로컬 고정 자격증명이라 LAN 에 열지 않는다.
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio_data:/data"]
  prism:
    image: stoplight/prism:5
    command: mock -h 0.0.0.0 -p 4010 /contracts/openapi.yml
    ports: ["4010:4010"]
    volumes: ["../contracts:/contracts:ro"]
volumes: { caddy_data: {}, mysql_data: {}, minio_data: {} }
