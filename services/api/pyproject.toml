[project]
name = "mwonmal-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.5",
  "pyyaml>=6",
  "sqlalchemy[asyncio]>=2.1",
  "alembic>=1.14",
  "aiomysql>=0.2",
  "cryptography>=43",
  "pyjwt[crypto]>=2.10",
  "httpx>=0.27",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "schemathesis>=3.39",
  "types-PyYAML",
  "jsonschema>=4.23",
  "types-jsonschema",
  "aiosqlite>=0.20",
  "import-linter>=2.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
[tool.mypy]
strict = true
[tool.pytest.ini_options]
testpaths = ["tests"]

# 컨텍스트끼리 직접 import 금지 (14번 §3, §17). 공용은 app.core 만.
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "컨텍스트 독립"
type = "independence"
modules = ["app.identity", "app.workspace", "app.decode", "app.learning", "app.notify"]

[[tool.importlinter.contracts]]
name = "core 는 컨텍스트를 모른다"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.identity", "app.workspace", "app.decode", "app.learning", "app.notify"]

[[tool.importlinter.contracts]]
name = "identity 층 방향 (api → infra → usecases → domain)"
type = "layers"
layers = ["app.identity.api", "app.identity.infra", "app.identity.usecases", "app.identity.domain"]
