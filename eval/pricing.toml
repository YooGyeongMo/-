# eval/pricing.toml — 단가·무료 한도 원본 (REQ-13 / FD-6 / ADR-0009)
#
# 규칙
#  1) 단위: LLM = USD / 1M tokens, STT = USD / 분, 저장 = USD / GB·월, 고정비 = USD / 월.
#  2) 값이 미확인이면 **키를 생략**하고 unverified = true 로 둔다 (null 금지 — tomllib 에 null 없음).
#     cost_model.py 는 생략된 단가를 0 으로 계산하고 "단가 미확인" 경고를 붙인다.
#  3) 갱신 절차: 공식 가격 페이지 확인 → 값 + verified_on = "YYYY-MM-DD" + source = "<URL>" + unverified = false
#     → PR (ADR 불필요, 단가만) → `make cost MAU=1000` 결과를 PR 본문에 첨부.
#  4) 무료 한도(RPD·RPM)는 자주 바뀐다. 월 1회 재확인.
#  5) 이 파일에는 확인되지 않은 숫자를 절대 넣지 않는다. 구조 시연·테스트용 가정 숫자는 pricing.example.toml.
#
# 현재 상태(2026-09-21): 전 항목 미확인. 아래는 자리표시자다.

[fx]
# krw_per_usd = <월초 매매기준율>
unverified = true
verified_on = ""
source = ""

[audio]
mb_per_minute = 1.0      # 설계 14번 §8 "조각 60초 ≈ 1MB" (가정)
retention_days = 30      # 설계 14번 §6 (결정)

# ── LLM 트랙 모델 (FD-4 사슬: gemini_free → openai_key/anthropic_key(평가 전용) → none) ─────────
[models.gemini_free]
provider = "google"
# input_per_mtok = / cached_input_per_mtok = / output_per_mtok =   (무료 티어 초과 시 유료 단가)
# free_rpd = / free_rpm =
over_limit = "fallback"
fallback_model = "none"
unverified = true
verified_on = ""
source = ""

[models.openai_key]           # 평가셋 전용 운영자 키. prod 사슬 제외 (FD-4)
provider = "openai"
over_limit = "pay"
unverified = true
verified_on = ""
source = ""

[models.anthropic_key]        # 평가셋 전용 운영자 키. prod 사슬 제외 (FD-4)
provider = "anthropic"
over_limit = "pay"
unverified = true
verified_on = ""
source = ""

[models.none]                 # 사전 + 규칙 기반 간이 해석. 외부 호출 0 → 단가 0 은 사실(설계)
provider = "self"
input_per_mtok = 0
cached_input_per_mtok = 0
output_per_mtok = 0
over_limit = "pay"
unverified = false
verified_on = "2026-09-21"
source = "docs/council/DECISIONS.md FD-4"

[models.fm]                   # Apple Foundation Models 온디바이스(iOS/macOS 26). 서버 단가 0 은 사실(설계). v1.0 진입은 FD-5 조건부
provider = "apple"
input_per_mtok = 0
cached_input_per_mtok = 0
output_per_mtok = 0
over_limit = "pay"
unverified = false
verified_on = "2026-09-21"
source = "docs/council/DECISIONS.md FD-5"

# ── STT 사슬 (FD-4: 서버 whisper_local 만. 외부 STT 는 약관 확인·ADR-0008 부록 첨부 전엔 사슬에 없음) ──
[[stt.chain]]
name = "whisper_local"
selfhost = true
free_sec_per_day = 0
# selfhost_cpu_min_per_audio_min = <faster-whisper CPU 실측: 오디오 1분당 CPU 분>
unverified = true
verified_on = ""
source = ""

# ── 저장 (Cloudflare R2, 오디오 30일) ────────────────────────────────────────────
[storage]
provider = "r2"
# usd_per_gb_month = / free_gb = / usd_per_million_class_a = / free_class_a_per_month =
unverified = true
verified_on = ""
source = ""

# ── 고정비 시나리오 (RT-B-15) ─────────────────────────────────────────────────
[fixed.oci_free]              # prod 기본. OCI Always Free = 0 USD 는 설계 결정(FD-6·FD-8)이지만 vCPU 수·약관은 확인 필요
usd_per_month = 0
# vcpus = <Always Free A1 OCPU 수>
cpu_utilization_cap = 0.7
label = "OCI Always Free"
unverified = true
verified_on = ""
source = ""

[fixed.aws_t4g_small]         # 옵션 시나리오
# usd_per_month = <서울 리전 온디맨드 월 환산>
# vcpus =
cpu_utilization_cap = 0.7
label = "AWS t4g.small (ap-northeast-2)"
unverified = true
verified_on = ""
source = ""

# ── 작업별 토큰 프로파일 (가정. 실측 = ai_usage 집계로 갱신) ─────────────────────
[tasks.translate]             # MESSAGE 1건: 4필드(용어·쉬운 말·숨은 뜻·할 일) 1회 생성 (FD-4)
input_tokens = 400
cached_tokens = 2000
output_tokens = 500

[tasks.meeting]               # MEETING_NOTE 해석: 받아쓰기 길이 비례
input_tokens = 300
cached_tokens = 1200
output_tokens = 800
per_minute_input_tokens = 400

[tasks.summary]               # 5000자 초과 요약
input_tokens = 200
cached_tokens = 0
output_tokens = 1500
per_minute_input_tokens = 400

# ── 트랙 (FD-5 4트랙 + prod 사슬) ─────────────────────────────────────────────
[tracks.gemini_free]
translate = "gemini_free"
meeting = "gemini_free"
summary = "gemini_free"
note = "prod 기본. 무료 한도 초과분은 none(사전)으로 강등"

[tracks.none]
translate = "none"
meeting = "none"
summary = "none"
note = "미동의 사용자 / 한도 초과 폴백"

[tracks.fm_preview]
translate = "fm"
meeting = "gemini_free"
summary = "gemini_free"
note = "FD-5 통과 시 미리보기. v1.0 은 정본이 서버라 서버 호출 불변 → usage.ondevice_rate 로만 반영"

[tracks.openai_key]
translate = "openai_key"
meeting = "openai_key"
summary = "openai_key"
note = "평가 전용"

[tracks.anthropic_key]
translate = "anthropic_key"
meeting = "anthropic_key"
summary = "anthropic_key"
note = "평가 전용"
